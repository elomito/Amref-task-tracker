{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Task Tracker</title>
  <link rel="stylesheet" href="{% static 'frontend/styles.css' %}">
</head>

<body>
  <div class="app">
    <header>
      <h1>Mini Task Tracker</h1>
    </header>

    <form style="display:none">{% csrf_token %}</form>
    <ul id="messages" class="messages"></ul>

    <section class="task-form-section">
      <h2 id="form-title">New Task</h2>
      <form id="task-form">
        <input type="hidden" id="task-id">
        <div class="field">
          <label for="task-title">Title *</label>
          <input type="text" id="task-title" name="title" placeholder="e.g. Write README">
        </div>
        <div class="field">
          <label for="task-description">Description</label>
          <textarea id="task-description" name="description" placeholder="Optional details"></textarea>
        </div>
        <div class="field">
          <label for="task-status">Status</label>
          <select id="task-status" name="status"></select>
        </div>
        <button type="submit" id="submit-btn">Add Task</button>
        <button type="button" id="cancel-btn" class="hidden">Cancel</button>
      </form>
    </section>

    <section class="task-list-section">
      <h2>Tasks</h2>
      <p id="list-status"></p>
      <ul id="task-list"></ul>
    </section>
  </div>
  <script src="{% static 'frontend/app.js' %}"></script>
</body>

</html>
